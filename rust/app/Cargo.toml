[package]
name = "witcher3-string-editor"
version = "0.1.0"
edition = "2024"
publish = false
description = "The Witcher 3 String Editor rewritten in Rust with egui"

[[bin]]
name = "harness"
path = "src/main.rs"

[[bin]]
name = "witcher3-string-editor"
path = "src/gui_main.rs"

[dependencies]
clap = "4"
w3codec-rs = { path = "../w3codec" }
settings-rs = { path = "../settings" }
locales-rs = { path = "../locales" }
dictionary-rs = { path = "../dictionary" }
services-rs = { path = "../services" }
xlsx-rs = { path = "../xlsx" }
translate-rs = { path = "../translate" }
nexus-rs = { path = "../nexus" }

eframe = { version = "0.31", default-features = true }
egui = "0.31"
egui_extras = { version = "0.31", features = ["all_loaders"] }
rfd = "0.18"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"

[workspace]
